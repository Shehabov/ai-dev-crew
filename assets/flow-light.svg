<text x="62" y="76" font-size="28" font-weight="600" letter-spacing="-0.4" fill="#021449">The delivery flow</text>
<text x="1138" y="76" font-size="16" font-weight="400" text-anchor="end" fill="rgba(2,20,73,0.64)">Read top to bottom</text>
<text x="450" y="282" font-size="14" font-weight="400" text-anchor="end" fill="rgba(2,20,73,0.64)">design track</text>
<text x="1030" y="282" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">build track</text>
<text x="600" y="380" font-size="14" font-weight="400" text-anchor="middle" fill="rgba(2,20,73,0.64)">until clean</text>
<text x="62" y="744" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">Four independent reviews, in parallel</text>
<text x="1138" y="744" font-size="14" font-weight="400" text-anchor="end" fill="rgba(2,20,73,0.64)">All four must pass</text>
<rect x="62" y="461" width="67.62" height="30" rx="15" fill="#21EA9D"/><text x="95.81" y="481.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">gate</text>
<text x="146" y="471" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">A gate. The next stage waits</text>
<text x="146" y="493" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">until its owner records a pass.</text>
<text x="95.81" y="632.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="rgba(2,20,73,0.64)">7</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1096" viewBox="0 0 1200 1096" role="img" aria-label="The twelve gates, in order: design-authority, owned by tech-architect; design, owned by ux-auditor; copy, owned by ux-writer; review-judgement, owned by peer-reviewer; review-defects, owned by code-analyst; review-readability, owned by code-steward; security, owned by security-analyst; regression-guard, owned by bug-historian; engineering, owned by engineering-lead; quality, owned by qc-lead; release, owned by release-engineer; run-closure, owned by orchestrator">
<title>The twelve gates, in order: design-authority, owned by tech-architect; design, owned by ux-auditor; copy, owned by ux-writer; review-judgement, owned by peer-reviewer; review-defects, owned by code-analyst; review-readability, owned by code-steward; security, owned by security-analyst; regression-guard, owned by bug-historian; engineering, owned by engineering-lead; quality, owned by qc-lead; release, owned by release-engineer; run-closure, owned by orchestrator</title>
<rect x="0.5" y="0.5" width="1199" height="1095" rx="28" fill="#F6F7FB" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<g font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<line x1="56" y1="180" x2="1144" y2="180" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="252" x2="1144" y2="252" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="324" x2="1144" y2="324" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="396" x2="1144" y2="396" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="468" x2="1144" y2="468" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="540" x2="1144" y2="540" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="684" x2="1144" y2="684" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="756" x2="1144" y2="756" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="828" x2="1144" y2="828" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="900" x2="1144" y2="900" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="972" x2="1144" y2="972" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<line x1="56" y1="1044" x2="1144" y2="1044" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<text x="56" y="220.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">01</text><rect x="100" y="201" width="210.46" height="30" rx="15" fill="#21EA9D"/><text x="205.23" y="221.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">design-authority</text><text x="366" y="221.78" font-size="17" font-weight="500" fill="#021449">tech-architect</text><text x="596" y="210.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">An ADR and task briefs exist</text><text x="596" y="232.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">and hold the product invariants</text>
<text x="56" y="292.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">02</text><rect x="100" y="273" width="91.42" height="30" rx="15" fill="#21EA9D"/><text x="145.71" y="293.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">design</text><text x="366" y="293.78" font-size="17" font-weight="500" fill="#021449">ux-auditor</text><text x="596" y="282.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">The spec survives an independent audit</text><text x="596" y="304.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">against the brand and WCAG 2.2 AA</text>
<text x="56" y="364.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">03</text><rect x="100" y="345" width="67.62" height="30" rx="15" fill="#21EA9D"/><text x="133.81" y="365.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">copy</text><text x="366" y="365.78" font-size="17" font-weight="500" fill="#021449">ux-writer</text><text x="596" y="354.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">Every string exists in every</text><text x="596" y="376.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">locale, within its length budget</text>
<text x="56" y="436.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">04</text><rect x="100" y="417" width="210.46" height="30" rx="15" fill="#21EA9D"/><text x="205.23" y="437.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">review-judgement</text><text x="366" y="437.78" font-size="17" font-weight="500" fill="#021449">peer-reviewer</text><text x="596" y="426.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">A senior read finds the design,</text><text x="596" y="448.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">boundaries and failure modes sound</text>
<text x="56" y="508.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">05</text><rect x="100" y="489" width="186.66" height="30" rx="15" fill="#21EA9D"/><text x="193.33" y="509.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">review-defects</text><text x="366" y="509.78" font-size="17" font-weight="500" fill="#021449">code-analyst</text><text x="596" y="498.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">A line-by-line read finds</text><text x="596" y="520.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">no open blocker or major</text>
<text x="56" y="580.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">06</text><rect x="100" y="561" width="234.27" height="30" rx="15" fill="#21EA9D"/><text x="217.14" y="581.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">review-readability</text><text x="366" y="581.78" font-size="17" font-weight="500" fill="#021449">code-steward</text><text x="596" y="570.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">Names, shape and comments</text><text x="596" y="592.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">meet the clean code standard</text>
<text x="56" y="652.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">07</text><rect x="100" y="633" width="115.23" height="30" rx="15" fill="#21EA9D"/><text x="157.62" y="653.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">security</text><text x="366" y="653.78" font-size="17" font-weight="500" fill="#021449">security-analyst</text><text x="596" y="642.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">Every pass of the security sweep ran,</text><text x="596" y="664.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">and nothing critical or high is open</text>
<text x="56" y="724.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">08</text><rect x="100" y="705" width="210.46" height="30" rx="15" fill="#21EA9D"/><text x="205.23" y="725.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">regression-guard</text><text x="366" y="725.78" font-size="17" font-weight="500" fill="#021449">bug-historian</text><text x="596" y="725.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">No defect already in BUGS.md has been repeated</text>
<text x="56" y="796.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">09</text><rect x="100" y="777" width="150.94" height="30" rx="15" fill="#21EA9D"/><text x="175.47" y="797.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">engineering</text><text x="366" y="797.78" font-size="17" font-weight="500" fill="#021449">engineering-lead</text><text x="596" y="786.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">It builds, migrates and runs end</text><text x="596" y="808.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">to end, with the log to prove it</text>
<text x="56" y="868.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">10</text><rect x="100" y="849" width="103.33" height="30" rx="15" fill="#21EA9D"/><text x="151.66" y="869.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">quality</text><text x="366" y="869.78" font-size="17" font-weight="500" fill="#021449">qc-lead</text><text x="596" y="858.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">The evidence holds up to</text><text x="596" y="880.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">audit, and the call is go</text>
<text x="56" y="940.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">11</text><rect x="100" y="921" width="103.33" height="30" rx="15" fill="#21EA9D"/><text x="151.66" y="941.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">release</text><text x="366" y="941.78" font-size="17" font-weight="500" fill="#021449">release-engineer</text><text x="596" y="930.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">Shipped, tagged, verified,</text><text x="596" y="952.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">with a written rollback</text>
<text x="56" y="1012.76" font-size="14" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(2,20,73,0.64)">12</text><rect x="100" y="993" width="150.94" height="30" rx="15" fill="#21EA9D"/><text x="175.47" y="1013.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">run-closure</text><text x="366" y="1013.78" font-size="17" font-weight="500" fill="#021449">orchestrator</text><text x="596" y="1002.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">Every planned role ran,</text><text x="596" y="1024.44" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">and every output was used</text>
<text x="56" y="76" font-size="28" font-weight="600" letter-spacing="-0.4" fill="#021449">The twelve gates</text>
<text x="56" y="108" font-size="16" font-weight="400" fill="rgba(2,20,73,0.64)">In the order a run meets them. Only the owner records the result, in its handoff.</text>
<text x="100" y="164" font-size="14" font-weight="600" fill="rgba(2,20,73,0.64)">Gate</text>
<text x="366" y="164" font-size="14" font-weight="600" fill="rgba(2,20,73,0.64)">Owner</text>
<text x="596" y="164" font-size="14" font-weight="600" fill="rgba(2,20,73,0.64)">Passes when</text>
</g>
</svg>

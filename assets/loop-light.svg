<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-label="The five-step loop: Plan, Audit the plan, Execute, Review, Hand off. Review returns to Execute to fix; Hand off passes to the next role.">
<title>The five-step loop: Plan, Audit the plan, Execute, Review, Hand off. Review returns to Execute to fix; Hand off passes to the next role.</title>
<rect x="0.5" y="0.5" width="1199" height="351" rx="28" fill="#F6F7FB" stroke="rgba(2,20,73,0.14)" stroke-width="1"/>
<g font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g opacity="0.5"><path d="M84 170 L259 170" fill="none" stroke="#021449" stroke-width="1.5" stroke-linejoin="round"/><path d="M266 170 L258 174.5 L258 165.5 Z" fill="#021449"/><path d="M312 170 L487 170" fill="none" stroke="#021449" stroke-width="1.5" stroke-linejoin="round"/><path d="M494 170 L486 174.5 L486 165.5 Z" fill="#021449"/><path d="M540 170 L715 170" fill="none" stroke="#021449" stroke-width="1.5" stroke-linejoin="round"/><path d="M722 170 L714 174.5 L714 165.5 Z" fill="#021449"/><path d="M768 170 L943 170" fill="none" stroke="#021449" stroke-width="1.5" stroke-linejoin="round"/><path d="M950 170 L942 174.5 L942 165.5 Z" fill="#021449"/><path d="M746 148 L746 128 Q746 112 730 112 L531.5 112 Q518 112 518 125.5 L518 139" fill="none" stroke="#021449" stroke-width="1.5" stroke-linejoin="round"/><path d="M518 146 L513.5 138 L522.5 138 Z" fill="#021449"/><path d="M996 170 L1153 170" fill="none" stroke="#021449" stroke-width="1.5" stroke-linejoin="round"/><path d="M1160 170 L1152 174.5 L1152 165.5 Z" fill="#021449"/></g>
<circle cx="62" cy="170" r="22" fill="#021449"/><text x="62" y="175.78" font-size="17" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#F6F7FB">1</text><text x="40" y="228" font-size="20" font-weight="600" fill="#021449">Plan</text><text x="40" y="256" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">Inputs, assumptions,</text><text x="40" y="276" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">acceptance criteria,</text><text x="40" y="296" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">out of scope</text>
<circle cx="290" cy="170" r="22" fill="#021449"/><text x="290" y="175.78" font-size="17" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#F6F7FB">2</text><text x="268" y="228" font-size="20" font-weight="600" fill="#021449">Audit the plan</text><text x="268" y="256" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">Adversarially,</text><text x="268" y="276" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">before a line of work</text>
<circle cx="518" cy="170" r="22" fill="#021449"/><text x="518" y="175.78" font-size="17" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#F6F7FB">3</text><text x="496" y="228" font-size="20" font-weight="600" fill="#021449">Execute</text><text x="496" y="256" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">Against the</text><text x="496" y="276" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">audited plan</text>
<circle cx="746" cy="170" r="22" fill="#021449"/><text x="746" y="175.78" font-size="17" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#F6F7FB">4</text><text x="724" y="228" font-size="20" font-weight="600" fill="#021449">Review</text><text x="724" y="256" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">Own output, against</text><text x="724" y="276" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">own criteria</text><text x="724" y="296" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">and the brand</text>
<circle cx="974" cy="170" r="22" fill="#021449"/><text x="974" y="175.78" font-size="17" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#F6F7FB">5</text><text x="952" y="228" font-size="20" font-weight="600" fill="#021449">Hand off</text><text x="952" y="256" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">A record the next</text><text x="952" y="276" font-size="14" font-weight="400" fill="rgba(2,20,73,0.64)">role can verify</text>
<rect x="1020.4" y="156" width="115.2" height="28" rx="14" fill="#21EA9D"/><text x="1078" y="175.1" font-size="15" font-weight="600" text-anchor="middle" fill="#021449">next role</text>
<text x="632" y="100" font-size="16" font-weight="400" text-anchor="middle" fill="rgba(2,20,73,0.64)">fix</text>
<text x="40" y="64" font-size="26" font-weight="600" letter-spacing="-0.4" fill="#021449">The five-step loop</text>
<text x="1160" y="64" font-size="16" font-weight="400" text-anchor="end" fill="rgba(2,20,73,0.64)">Every agent runs it inside its own turn</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="788" viewBox="0 0 1200 788" role="img" aria-label="The security gate, owned by security-analyst. The sweep, in order: Secrets and keys; Exposure and configuration; Authentication and access control; Injection and dangerous functions; Dependencies and supply chain; Data handling; Failure handling. Blocks on its own authority. Critical and high findings are fixed or accepted in writing.">
<title>The security gate, owned by security-analyst. The sweep, in order: Secrets and keys; Exposure and configuration; Authentication and access control; Injection and dangerous functions; Dependencies and supply chain; Data handling; Failure handling. Blocks on its own authority. Critical and high findings are fixed or accepted in writing.</title>
<rect x="0.5" y="0.5" width="1199" height="787" rx="28" fill="#021449" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<g font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<line x1="64" y1="156" x2="1136" y2="156" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<line x1="64" y1="232" x2="1136" y2="232" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<line x1="64" y1="308" x2="1136" y2="308" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<line x1="64" y1="384" x2="1136" y2="384" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<line x1="64" y1="460" x2="1136" y2="460" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<line x1="64" y1="536" x2="1136" y2="536" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<line x1="64" y1="612" x2="1136" y2="612" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<line x1="64" y1="688" x2="1136" y2="688" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="64" y="199.44" font-size="16" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(255,255,255,0.64)">01</text><circle cx="132" cy="194" r="15" fill="#21EA9D"/><path d="M126 194.5 L130.5 199 L138.5 189" fill="none" stroke="#021449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="188" font-size="20" font-weight="600" fill="#FFFFFF">Secrets and keys</text><text x="168" y="212" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">Keys and passwords in the diff, the tree and every commit.</text>
<text x="64" y="275.44" font-size="16" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(255,255,255,0.64)">02</text><circle cx="132" cy="270" r="15" fill="#21EA9D"/><path d="M126 270.5 L130.5 275 L138.5 265" fill="none" stroke="#021449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="264" font-size="20" font-weight="600" fill="#FFFFFF">Exposure and configuration</text><text x="168" y="288" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">Open data stores and endpoints, storage, client variables, CORS.</text>
<text x="64" y="351.44" font-size="16" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(255,255,255,0.64)">03</text><circle cx="132" cy="346" r="15" fill="#21EA9D"/><path d="M126 346.5 L130.5 351 L138.5 341" fill="none" stroke="#021449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="340" font-size="20" font-weight="600" fill="#FFFFFF">Authentication and access control</text><text x="168" y="364" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">Decided on the server, IDOR probed as every role, every route in.</text>
<text x="64" y="427.44" font-size="16" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(255,255,255,0.64)">04</text><circle cx="132" cy="422" r="15" fill="#21EA9D"/><path d="M126 422.5 L130.5 427 L138.5 417" fill="none" stroke="#021449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="416" font-size="20" font-weight="600" fill="#FFFFFF">Injection and dangerous functions</text><text x="168" y="440" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">SQL, XSS, command and template injection, eval and its relatives.</text>
<text x="64" y="503.44" font-size="16" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(255,255,255,0.64)">05</text><circle cx="132" cy="498" r="15" fill="#21EA9D"/><path d="M126 498.5 L130.5 503 L138.5 493" fill="none" stroke="#021449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="492" font-size="20" font-weight="600" fill="#FFFFFF">Dependencies and supply chain</text><text x="168" y="516" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">Every new package proved real, the audit clean of known CVEs.</text>
<text x="64" y="579.44" font-size="16" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(255,255,255,0.64)">06</text><circle cx="132" cy="574" r="15" fill="#21EA9D"/><path d="M126 574.5 L130.5 579 L138.5 569" fill="none" stroke="#021449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="568" font-size="20" font-weight="600" fill="#FFFFFF">Data handling</text><text x="168" y="592" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">Client storage, data in URLs and logs, headers, CSRF, rate limits.</text>
<text x="64" y="655.44" font-size="16" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" fill="rgba(255,255,255,0.64)">07</text><circle cx="132" cy="650" r="15" fill="#21EA9D"/><path d="M126 650.5 L130.5 655 L138.5 645" fill="none" stroke="#021449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="644" font-size="20" font-weight="600" fill="#FFFFFF">Failure handling</text><text x="168" y="668" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">Every failure path run, nothing swallowed, errors and logs clean.</text>
<text x="64" y="88" font-size="32" font-weight="600" letter-spacing="-0.5" fill="#FFFFFF">The security gate</text>
<rect x="720.77" y="67" width="115.23" height="30" rx="15" fill="#21EA9D"/><text x="778.38" y="87.44" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#021449">security</text>
<text x="1136" y="88" font-size="16" font-weight="400" text-anchor="end" fill="rgba(255,255,255,0.64)">owned by security-analyst</text>
<text x="64" y="124" font-size="16" font-weight="400" fill="rgba(255,255,255,0.64)">Run on every diff, in this order. Every pass keeps its output as evidence, clean or not.</text>
<text x="64" y="732" font-size="16" font-weight="500" fill="#FFFFFF">Blocks on its own authority. Critical and high findings are fixed or accepted in writing.</text>
</g>
</svg>
